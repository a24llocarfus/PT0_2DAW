<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administració de Preguntes</title>
    <!-- Incloent Bootstrap des del CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-primary m-0">Panell d'Administració</h1>
            <a href="index.html" class="btn btn-outline-secondary">← Tornar al joc</a>
        </div>
        
        <button id="btn_nova_pregunta" class="btn btn-success mb-4 shadow-sm">Crear Nova Pregunta</button>

        <div id="llistat_preguntes" class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped table-hover m-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Pregunta</th>
                            <th>Imatge</th>
                            <th>Accions</th>
                        </tr>
                    </thead>
                    <tbody id="taula_preguntes">
                        <!-- S'omplirà dinàmicament amb admin.js -->
                    </tbody>
                </table>
            </div>
        </div>

        <div id="formulari_edicio" class="card shadow-sm d-none">
            <div class="card-header bg-primary text-white">
                <h4 id="titol_formulari" class="m-0">Afegir Pregunta</h4>
            </div>
            <div class="card-body">
                <form id="admin_form">
                    <input type="hidden" id="form_id">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Títol de la pregunta:</label>
                        <input type="text" id="form_pregunta" class="form-control" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Resposta 1:</label>
                            <input type="text" id="form_resp1" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Resposta 2:</label>
                            <input type="text" id="form_resp2" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Resposta 3:</label>
                            <input type="text" id="form_resp3" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Resposta 4:</label>
                            <input type="text" id="form_resp4" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Quina és la resposta correcta? (Del 1 al 4):</label>
                        <input type="number" id="form_correcta" class="form-control w-25" min="1" max="4" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Enllaç de la imatge (Opcional):</label>
                        <input type="url" id="form_imatge" class="form-control" placeholder="Ex: https://...">
                    </div>
                    
                    <button type="submit" id="btn_guardar" class="btn btn-primary">Guardar Pregunta</button>
                    <button type="button" id="btn_cancelar" class="btn btn-secondary">Cancel·lar</button>
                </form>
            </div>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
