<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joc de Preguntes</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .quiz-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        .sticky-timer-bar {
            position: sticky;
            top: 10px;
            z-index: 1030;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }
        .pregunta-titol {
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.95rem;
        }
        .pregunta-img-box {
            height: 105px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pregunta-img {
            max-height: 100px;
            max-width: 160px;
            object-fit: contain;
            border-radius: 8px;
        }
        .btnRespuesta {
            font-size: 0.85rem;
            padding: 0.4rem 0.5rem !important;
            border-radius: 8px;
            width: 100%;
            height: 100%;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.25;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="quiz-card p-3 p-sm-4">
    <!-- Enllaç discret a Administració -->
    <div class="d-flex justify-content-end mb-2">
        <a href="admin.html" class="btn btn-sm btn-outline-secondary py-0 px-2" style="font-size: 0.75rem;">⚙️ Admin</a>
    </div>

    <!-- Formulari Inicial -->
    <div id="seccio_usuari">
        <div id="grup_input_nom" class="input-group mb-2">
            <input type="text" id="input_nom" class="form-control form-control-sm" placeholder="Nom del jugador...">
            <button id="btn_guardar_nom" class="btn btn-primary btn-sm fw-bold px-3">Començar</button>
        </div>
        <div id="div_benvinguda" class="alert alert-success d-none fw-bold text-center py-2 px-3 m-0 small"></div>
        <button id="btn_esborrar_nom" class="btn btn-outline-danger btn-sm d-none mt-2 w-100 py-1" style="font-size: 0.8rem;">Canviar de Jugador</button>
    </div>
    
    <!-- Pantalla de Joc -->
    <div id="pantalla_joc" class="d-none">
        <!-- Cronòmetre Sticky -->
        <div id="info_partida" class="sticky-timer-bar d-flex justify-content-between align-items-center p-2 px-3 mb-2">
            <span id="cronometre" class="text-danger fw-bold fs-6 m-0">⏱️ Temps: 30 s</span>
            <div id="marcador"></div>
        </div>
        
        <!-- Preguntes -->
        <div id="partida"></div>
        
        <!-- Navegació -->
        <div id="controls_navegacio" class="row g-2 d-none my-2">
            <div class="col-6">
                <button id="btn_anterior" class="btn btn-secondary btn-sm w-100 py-1 fw-bold">← Anterior</button>
            </div>
            <div class="col-6">
                <button id="btn_seguent" class="btn btn-primary btn-sm w-100 py-1 fw-bold">Següent →</button>
            </div>
        </div>
        
        <!-- Botó Enviar -->
        <button id="btn_enviar" class="btn btn-success btn-sm d-none w-100 py-2 fw-bold mt-2">✓ ENVIAR RESPOSTES</button>
    </div>
</div>

<script src="funcions.js"></script>
</body>
</html>
